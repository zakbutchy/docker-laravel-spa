# コンテナ定義
services:
  ####################
  # Node server
  ####################
  node:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    ports:
      - "${NODE_PORT:-5173}:5173"
    volumes:
      - "./client:/var/www/html"
      # ホストのnode_modulesと衝突させないための名前付きボリューム
      - "node_modules:/var/www/html/node_modules"
    tty: true

  ####################
  # PHP server
  ####################
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    # DBが実際に接続を受け付けられる状態になってから起動する
    depends_on:
      mysql:
        condition: service_healthy
    # serverディレクトリをphpコンテナの/var/www/htmlへマウント
    volumes:
      - ./server:/var/www/html
    networks:
      - backend

  ####################
  # Web server
  ####################
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - php
    # server配下のファイルをコンテナ内の~/var/www/html配下に配置
    volumes:
      - ./server:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # nginxのログをホスト側に永続化する
      # - ./docker/nginx/logs:/var/log/nginx
    networks:
      - backend

  ####################
  # DB server
  ####################
  mysql:
    build:
      context: .
      dockerfile: ./docker/mysql/Dockerfile
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-store:/var/lib/mysql
      # コンテナ初回起動時にinitdb.d配下のDDL実行
      - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
    # 環境変数の指定
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-test_db}
      - MYSQL_USER=${DB_USERNAME:-testuser}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-secret}
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD:-secret}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  ####################
  # Redis
  ####################
  redis:
    image: redis:8.10.0-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - backend

  ####################
  # phpMyAdmin
  ####################
  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin
  #   ports:
  #     - "127.0.0.1:${PMA_PORT:-8888}:80"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     - PMA_ARBITRARY=1
  #     # mysqlのservices名を指定
  #     - PMA_HOST=mysql
  #     # 以下2行のコメントアウトを外せばログイン画面を出さずに開けるようになるがローカル環境以外では外さないこと
  #     # - PMA_USER=${DB_USERNAME:-testuser}
  #     # - PMA_PASSWORD=${DB_PASSWORD:-password}
  #   restart: always
  #   networks:
  #     - backend

  ####################
  # Mailpit
  ####################
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - backend
    # メール履歴を永続化したい場合は、restart指定に加えてMP_DATA_FILE環境変数とvolumeマウントを設定する
    # restart: unless-stopped
    # environment:
    #   MP_DATA_FILE: /tmp/mailpit
    # volumes:
    #   - ./mails/mailpit:/tmp/mailpit

volumes:
  # 名前付きボリュームを定義
  mysql-store:
  node_modules:

networks:
  backend:
    driver: bridge
