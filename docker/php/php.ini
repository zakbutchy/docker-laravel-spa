; 例外のスタックトレースに関数の引数も含める（デバッグ用。引数に機密情報が含まれ得るため本番ではonを検討）
zend.exception_ignore_args = off
; スクリプトの最大実行時間（秒）
max_execution_time = 30
; リクエストで受け取れる入力変数（GET/POST/COOKIE）の最大数
max_input_vars = 1000
; アップロード可能な単一ファイルの最大サイズ
upload_max_filesize = 64M
; POSTリクエスト全体の最大サイズ（upload_max_filesizeより大きくする必要がある）
post_max_size = 128M
; PHPスクリプト1つあたりが使用できる最大メモリ量
memory_limit = 256M
; エラー内容を画面に直接出力する（開発用。本番ではoffにすべき）
display_errors = on
; PHP起動時のエラーも画面に出力する（開発用）
display_startup_errors = on
; エラーをログに記録する
log_errors = on
; エラーログの出力先（コンテナのログとして収集できるよう標準エラー出力に向ける）
error_log = /dev/stderr
; 報告対象とするエラーレベル（開発中に問題を見逃さないよう全て報告）
error_reporting = E_ALL
; デフォルトの文字エンコーディング
default_charset = UTF-8
; セキュリティを向上させるため、PHPのバージョンをレスポンスヘッダに含めないようにする
expose_php = Off

[Date]
date.timezone = Asia/Tokyo

[mysqlnd]
; mysqlndのメモリ使用量統計を収集する（デバッグ用、若干のオーバーヘッドあり）
mysqlnd.collect_memory_statistics = on

[Assertion]
; assert()を実際に生成・実行する（開発用。本番では-1にしてパフォーマンスを優先するのが一般的）
zend.assertions = 1

[mbstring]
; mbstring拡張のデフォルト言語（日本語の内部エンコーディング処理に影響）
mbstring.language = Japanese
