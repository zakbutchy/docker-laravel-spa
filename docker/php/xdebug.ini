; ============================================================
; このファイルはローカル開発専用のXdebug設定
; 本番環境ではXdebug自体を無効化・アンインストールすること
; （デバッグ機能はオーバーヘッドが大きく、コード内容の外部漏洩リスクもあるため）
; ============================================================

; ホストを指定
; Docker Desktop/OrbStack環境でホストマシンを指すマジックDNS名。Linux上のDockerではhost-gateway等の別途設定が必要な場合がある
xdebug.client_host = host.docker.internal
; ホスト側のポート指定（IDE側のリスニングポートと合わせる）
xdebug.client_port = 9003
; リモートデバッグを有効化
xdebug.mode = debug
; リクエストがあった際にデバッグを開始
xdebug.start_with_request = yes
; クライアントホストの自動検出を無効化し、xdebug.client_hostの指定を優先する
xdebug.discover_client_host = 0
; Xdebug自体のログ出力先（コンテナ内のファイルのため、確認するにはコンテナに入って参照する必要がある）
xdebug.log = /var/log/xdebug.log
; VSCodeをIDEとして指定
; xdebug.idekey="VSCODE"
