server {
    listen 80;
    server_name example.com;
    # ルートディレクトリ（ドキュメントルート）を指定
    root /var/www/html/public;

    # クリックジャッキング対策（自サイト以外のframe/iframeへの埋め込みを禁止）
    add_header X-Frame-Options "SAMEORIGIN";
    # レスポンスのContent-Typeを尊重させ、ブラウザによる中身の自動判定（MIMEスニッフィング）を無効化
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    # アップロード可能なリクエストボディの最大サイズ（php.iniのpost_max_sizeと揃える）
    client_max_body_size 128M;

    # 同じディレクティブを複数回書くと両方の出力先へ同時にログ出力できる
    # コンテナログ（docker compose logs）用の標準出力/標準エラー出力
    access_log /dev/stdout;
    error_log  /dev/stderr;
    # ファイル永続化したい場合は ./docker/nginx/logs を作成し、.gitignore に追加した上で以下を有効化
    # access_log /var/log/nginx/access.log;
    # error_log  /var/log/nginx/error.log;

    charset utf-8;

    # 全てのリクエスト
    location / {
        # リクエストされたファイルが存在しなければフロントコントローラーに内部リダイレクト
        try_files $uri $uri/ /index.php?$query_string;
    }

    # favicon.icoとrobots.txtはアクセスログを出力しない
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # 404もフロントコントローラーに回してLaravel側のルーティング・エラーハンドリングに任せる
    error_page 404 /index.php;

    # 全ての PHP ファイル
    location ~ \.php$ {
        # FastCGI で PHP-FPM コンテナへ転送
        # PHP-FPMはデフォルトで9000番のポートを使用するため、PHPコンテナの9000番へルーティング
        fastcgi_pass php:9000;
        # PHP-FPM コンテナで実行する PHP ファイルの名前
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # デフォルトの FastCGI パラメーター
        include fastcgi_params;
    }

    # .well-known以外のドットファイル（.env、.gitなど）への直接アクセスを禁止
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
